name: Hassfest

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - "custom_components/neopool/**"
  pull_request:
    paths:
      - "custom_components/neopool/**"

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Hassfest validation
        # uses: "home-assistant/actions/hassfest@master"
        # The official action runs the hassfest image with no arguments. We run
        # the same image directly so we can skip the requirements plugin: it
        # flags our neopool-modbus pin as incompatible with the pin the core
        # neopool integration ships, a false positive since a custom integration
        # fully overrides its core namesake at runtime. Drop the skip once a
        # released core ships the matching library pin.
        run: |
          docker run --rm -v "${{ github.workspace }}://github/workspace" \
            ghcr.io/home-assistant/hassfest --skip-plugins requirements
